<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evidence Vault & Logger</title>
  <!-- Tailwind CSS & FontAwesome CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-8">
    
    <!-- Top Bar -->
    <header class="flex items-center justify-between pb-6 border-b border-slate-800 mb-8">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-white flex items-center gap-3">
          <i class="fa-solid fa-fingerprint text-indigo-400"></i>
          Evidence Vault & Logger
        </h1>
        <p class="text-slate-400 text-sm mt-1">Cryptographic integrity logging & tamper verification</p>
      </div>
      <button onclick="fetchEvidence()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg border border-slate-700 transition flex items-center gap-2">
        <i class="fa-solid fa-rotate-right"></i> Refresh
      </button>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Upload Panel -->
      <section class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-6 shadow-xl h-fit">
        <h2 class="text-lg font-semibold mb-4 text-indigo-300 flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> Log New Evidence
        </h2>

        <form id="uploadForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Case ID *</label>
            <input type="text" id="case_id" required placeholder="e.g. CASE-2026-001" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition"/>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Evidence File *</label>
            <input type="file" id="evidenceFile" required 
                   class="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer bg-slate-900 border border-slate-700 rounded-lg p-1"/>
          </div>

          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Remarks / Custody Notes</label>
            <textarea id="remarks" rows="3" placeholder="Chain of custody notes, location found, examiner name..." 
                      class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition"></textarea>
          </div>

          <button type="submit" id="submitBtn" 
                  class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30">
            <i class="fa-solid fa-shield-halved"></i> Hash & Store Evidence
          </button>
        </form>

        <div id="statusMessage" class="hidden mt-4 text-xs p-3 rounded-lg"></div>
      </section>

      <!-- Evidence Table Panel -->
      <section class="lg:col-span-2 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-slate-400"></i> Evidence Records
          </h2>
          <input type="text" id="searchBox" oninput="filterTable()" placeholder="Filter by Case, File, or Hash..." 
                 class="bg-slate-800 border border-slate-700 text-xs px-3 py-1.5 rounded-lg text-slate-200 w-64 focus:outline-none focus:border-indigo-500"/>
        </div>

        <div class="overflow-x-auto bg-slate-800/40 border border-slate-700/60 rounded-xl shadow-xl">
          <table class="w-full text-left text-xs">
                        <thead class="bg-slate-800/80 text-slate-400 border-b border-slate-700 uppercase tracking-wider font-semibold">
              <tr>
                <th class="py-3 px-3">ID</th>
                <th class="py-3 px-3">Case</th>
                <th class="py-3 px-3">Filename / Size</th>
                <th class="py-3 px-3">Remarks</th>
                <th class="py-3 px-3">SHA-256</th>
                <th class="py-3 px-3">Logged (UTC)</th>
                <th class="py-3 px-3 text-center">Verify / AI</th>
              </tr>
            </thead>
            <tbody id="evidenceTableBody" class="divide-y divide-slate-800">
              <tr>
                <td colspan="7" class="text-center py-8 text-slate-500">Loading evidence records...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </div>
  </div>

  <!-- Gemini AI Analysis Modal -->
  <div id="aiModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl">
      <div class="flex items-center justify-between p-4 border-b border-slate-800">
        <h3 class="text-base font-semibold text-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-wand-magic-sparkles text-indigo-400"></i>
          Gemini Forensic Threat Analysis: <span id="modalArtifactTitle" class="text-indigo-300 font-mono text-sm"></span>
        </h3>
        <button onclick="closeAiModal()" class="text-slate-400 hover:text-slate-200 text-lg p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="modalAiContent" class="p-5 overflow-y-auto text-xs leading-relaxed text-slate-300 space-y-3 font-mono whitespace-pre-wrap">
        Loading Gemini threat analysis...
      </div>
      <div class="p-3 border-t border-slate-800 flex justify-end">
        <button onclick="closeAiModal()" class="px-4 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-medium transition">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- Link your separated JS script -->
  <script src="/static/app.js"></script>
</body>
</html>
